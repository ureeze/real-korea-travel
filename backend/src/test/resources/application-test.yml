spring:
  datasource:
    url: jdbc:h2:mem:realkorea;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: dummy-client-id-for-test
            client-secret: dummy-client-secret-for-test
            scope:
              - email
              - profile

security:
  jwt:
    secret: test-secret-that-is-at-least-32-characters-long
    access-token-expiration-seconds: 900
    refresh-token-expiration-seconds: 1209600
