spring:
  application:
    name: real-korea-travel
  datasource:
    url: jdbc:postgresql://localhost:5432/realkorea
    username: realkorea
    password: realkorea1234
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

server:
  port: 8080

management:
  endpoints:
      web:
        exposure:
          include: health,info

security:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-seconds: ${JWT_ACCESS_EXPIRATION_SECONDS:3600}
    refresh-token-expiration-seconds: ${JWT_REFRESH_EXPIRATION_SECONDS:1209600}

openai:
  api-key: ${OPENAI_API_KEY:}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com}
  model: ${OPENAI_MODEL:gpt-5.6-luna}
  connect-timeout: ${OPENAI_CONNECT_TIMEOUT:2s}
  read-timeout: ${OPENAI_READ_TIMEOUT:30s}
  max-attempts: ${OPENAI_MAX_ATTEMPTS:3}
  retry-backoff: ${OPENAI_RETRY_BACKOFF:500ms}
