services:
  postgres:
    image: postgres:18.4
    container_name: realkorea-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: realkorea
      POSTGRES_USER: realkorea
      POSTGRES_PASSWORD: realkorea1234
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realkorea -d realkorea"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.10
    container_name: realkorea-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data: